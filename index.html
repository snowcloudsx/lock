<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Current Protocol</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #1c1c1e;
            --text: #ffffff;
            --text-muted: #8e8e93;
            --accent: #30d158; /* iOS Green */
            --danger: #ff453a; /* iOS Red */
            --border: #38383a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .active-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid var(--border);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .active-card.danger {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 69, 58, 0.15);
        }

        .time-block {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .active-card.danger .time-block {
            color: var(--danger);
        }

        .task-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.1;
        }

        .checklist {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .check-item {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            padding: 18px 20px;
            border-radius: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .check-item:active {
            transform: scale(0.98);
        }

        .check-item.completed {
            opacity: 0.4;
        }

        .check-item.completed .check-text {
            text-decoration: line-through;
        }

        .checkbox {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--border);
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .check-item.completed .checkbox {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .check-item.danger.completed .checkbox {
            background-color: var(--danger);
            border-color: var(--danger);
        }

        .checkbox::after {
            content: "✓";
            color: #000;
            font-weight: 900;
            font-size: 16px;
            display: none;
        }

        .check-item.completed .checkbox::after {
            display: block;
        }

        .check-text {
            font-size: 18px;
            font-weight: 600;
        }

        .next-up {
            margin-top: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="status-bar">
        <span id="current-time">--:--</span>
        <span id="status-text">ACTIVE NOW</span>
    </div>

    <div id="app-container">
        <!-- The active card renders here -->
    </div>

    <script>
        // The Protocol Data
        const schedule = [
            { 
                start: "06:00", end: "06:30", title: "Morning Wake Up", danger: false,
                tasks: ["Drink 500ml water immediately", "Wash face with cold water", "No phone scrolling"]
            },
            { 
                start: "06:30", end: "07:00", title: "Breakfast", danger: false,
                tasks: ["Eat 3 eggs", "1 piece of toast", "Drink water (no juice)"]
            },
            { 
                start: "07:00", end: "14:15", title: "School Protocol", danger: false,
                tasks: ["Drink 1L water before lunch", "Tongue on roof of mouth", "Eat prepped lunch (protein first)"]
            },
            { 
                start: "14:15", end: "15:30", title: "DANGER ZONE", danger: true,
                tasks: ["Go straight to weight room/climb", "DO NOT open the pantry", "Zero Red Bull/Chips"]
            },
            { 
                start: "15:30", end: "17:00", title: "Training", danger: false,
                tasks: ["45 min weightlifting/climbing", "Hit 10,000 steps total", "Drink 1L water"]
            },
            { 
                start: "17:00", end: "20:00", title: "Dinner & Evening", danger: false,
                tasks: ["Protein first, veggies second", "HALF portion of carbs", "NO SECONDS. Kitchen closes at 8."]
            },
            { 
                start: "20:00", end: "21:00", title: "Shutdown", danger: true,
                tasks: ["No food. Water only.", "Skincare (wash + moisturize)", "Prep bag for tomorrow"]
            },
            { 
                start: "21:00", end: "23:59", title: "Sleep Protocol", danger: false,
                tasks: ["PHONE IN THE KITCHEN", "Lights out by 21:30", "8.5 hours sleep for Test/HGH"]
            }
        ];

        // Get today's date for daily reset (MM/DD/YYYY)
        const today = new Date().toLocaleDateString();

        function timeToMins(timeStr) {
            const [h, m] = timeStr.split(":").map(Number);
            return (h * 60) + m;
        }

        function render() {
            const now = new Date();
            const currentMins = (now.getHours() * 60) + now.getMinutes();
            
            // Update clock
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // Find current task
            let activeTask = null;
            let activeIndex = -1;

            for (let i = 0; i < schedule.length; i++) {
                const task = schedule[i];
                const startMins = timeToMins(task.start);
                const endMins = timeToMins(task.end);

                if (currentMins >= startMins && currentMins < endMins) {
                    activeTask = task;
                    activeIndex = i;
                    break;
                }
            }

            const container = document.getElementById('app-container');
            const statusText = document.getElementById('status-text');

            // If outside scheduled hours (e.g., 2 AM), show sleep
            if (!activeTask) {
                if (currentMins < timeToMins("06:00")) {
                    statusText.innerText = "SLEEPING";
                    container.innerHTML = `
                        <div class="active-card">
                            <div class="time-block">00:00 - 06:00</div>
                            <div class="task-title">Go to sleep.</div>
                            <div class="checklist">
                                <div class="check-item completed">
                                    <div class="checkbox"></div>
                                    <div class="check-text">Phone is in the kitchen</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // After 23:59 (rare edge case, just show sleep)
                    statusText.innerText = "SLEEPING";
                    container.innerHTML = `<div class="task-title">Go to bed.</div>`;
                }
                return;
            }

            statusText.innerText = activeTask.danger ? "CAUTION" : "ACTIVE NOW";

            // Build HTML
            let html = `
                <div class="active-card ${activeTask.danger ? 'danger' : ''}">
                    <div class="time-block">${activeTask.start} - ${activeTask.end}</div>
                    <div class="task-title">${activeTask.title}</div>
                    <div class="checklist">
            `;

            activeTask.tasks.forEach((taskText, taskIndex) => {
                const storageKey = `${today}-${activeIndex}-${taskIndex}`;
                const isChecked = localStorage.getItem(storageKey) === 'true';
                
                html += `
                    <div class="check-item ${isChecked ? 'completed' : ''} ${activeTask.danger ? 'danger' : ''}" onclick="toggleCheck('${storageKey}', this)">
                        <div class="checkbox"></div>
                        <div class="check-text">${taskText}</div>
                    </div>
                `;
            });

            html += `</div></div>`;

            // Add "Next Up" text
            if (activeIndex < schedule.length - 1) {
                const nextTask = schedule[activeIndex + 1];
                html += `<div class="next-up">Next up: ${nextTask.title} at ${nextTask.start}</div>`;
            }

            container.innerHTML = html;
        }

        function toggleCheck(key, element) {
            const isCompleted = element.classList.contains('completed');
            if (isCompleted) {
                element.classList.remove('completed');
                localStorage.setItem(key, 'false');
            } else {
                element.classList.add('completed');
                localStorage.setItem(key, 'true');
            }
        }

        // Initial render
        render();

        // Check time every 30 seconds to swap tasks
        setInterval(render, 30000);

    </script>
</body>
</html>
